<!DOCTYPE html>
<!--
  Netlify Forms detection stub.
  Netlify's build-time crawler finds this form so it registers the "contact" form.
  The actual UI form lives in the Next.js app (app/[locale]/iletisim/page.tsx).
-->
<html lang="tr">
<head><meta charset="UTF-8"><title>Zeybek Academy – Form</title></head>
<body>
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contact" />
    <p class="hidden"><label>Do not fill: <input name="bot-field" /></label></p>
    <input type="text"  name="name"    />
    <input type="email" name="email"   />
    <input type="tel"   name="phone"   />
    <select name="service">
      <option value="weekly">Haftalık ders</option>
      <option value="private">Özel ders</option>
      <option value="couple">Gelin-damat dersi</option>
      <option value="wedding">Düğün gösterisi</option>
      <option value="other">Diğer</option>
    </select>
    <textarea name="message"></textarea>
    <button type="submit">Gönder</button>
  </form>
</body>
</html>
